---
# Execute command in the WSL distribution
- name: "Set the command executed in WSL distribution"
  ansible.builtin.set_fact:
    distro_command: "cat /etc/os-release"

- name: "Run the command '{{ distro_command }}' in WSL distribution"
  include_tasks: execute_wsl_command.yml
  vars:
    wsl_command: "wsl -d {{ wsl_distribution_name }} {{ distro_command }}"
    wsl_command_ignore_errors: true

- name: "Check the result of the command executed in WSL distribution"
  ansible.builtin.assert:
    that:
      - win_wsl_cmd_output.rc is defined
      - win_wsl_cmd_output.rc == 0
      - win_wsl_cmd_output.stderr is defined
      - win_wsl_cmd_output.stderr | length == 0
      - win_wsl_cmd_output.stdout is defined
      - win_wsl_cmd_output.stdout is search(wsl_distribution_name)
    fail_msg: "Executing command '{{ distro_command }}' in WSL distribution returns error message: {{ win_wsl_cmd_output.stderr | default('') | replace('\u0000', '') }}, or not get the distribution '{{ wsl_distribution_name }}' info in the command output: {{ win_wsl_cmd_output.stdout | default('') }}."
