---
- name: "Unregister the installed WSL distribution"
  include_tasks: execute_wsl_command.yml
  vars:
    wsl_command: "wsl.exe --unregister {{ wsl_distribution_name }}"

- name: "Pause 10 seconds after distribution unregister"
  ansible.builtin.pause:
    seconds: 10

- name: "Get WSL distribution status after unregister"
  include_tasks: execute_wsl_command.yml
  vars:
    wsl_command: "wsl.exe --list"
    wsl_command_ignore_errors: true

- name: "Check there is no WSL distribution after unregister"
  ansible.builtin.assert:
    that:
      - win_wsl_cmd_output.rc is defined
      - win_wsl_cmd_output.rc == 0
      - win_wsl_cmd_output.stdout is defined
      - win_wsl_cmd_output.stdout is search("has no installed distributions")
    fail_msg: >-
      List WSL distribution failed after executing unregister WSL distribution
      '{{ wsl_distribution_name }}' command or not found key string 'has no installed distributions'
      in the output '{{ win_wsl_cmd_output.stdout | default('') }}'.
