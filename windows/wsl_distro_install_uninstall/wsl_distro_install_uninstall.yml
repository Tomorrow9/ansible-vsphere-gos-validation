---
# Description:
#   This test case verifies WSL 2 and Linux distribution installation,
# execution, and distribution unregistration in Windows guest OS.
# Notes:
# 1. WSL 2 Support Status:
#   Windows Client: WSL 2 is available in Windows 11 or Windows 10 version 1903
# or later. Windows 10 versions 1903 and 1909 require x64 builds 18362.1049
# and 18363.1049 or later, respectively. ARM64 requires Windows 10 version 2004,
# Build 19041 or later.
# https://learn.microsoft.com/en-us/windows/wsl/install-manual
#   Windows Server: Windows Server 2022 (Build 20348) and Windows Server 2025
# (Build 26100) support WSL 2.
# https://learn.microsoft.com/en-us/windows/wsl/install-on-server
# 2. Test Case Support Status:
#   Windows Client: This test requires Windows 10 version 2004, Build 19041 or later,
# or Windows 11 for the automated installation commands.
# https://learn.microsoft.com/en-us/windows/wsl/install
#   Windows Server: This test targets Windows Server 2022 and Windows Server 2025,
# Windows Server SAC/AC releases are excluded.
#
- name: wsl_distro_install_uninstall
  hosts: localhost
  gather_facts: no
  tasks:
    - name: "Test case block"
      block:
        - name: "Skip test case"
          include_tasks: ../../common/skip_test_case.yml
          vars:
            skip_msg: >-
              Skip test case '{{ ansible_play_name }}' because nested virtualization is not supported
              on ESXi on ARM.
            skip_reason: "Not Supported"
          when: esxi_cpu_vendor == 'arm'

        - name: "Test setup"
          include_tasks: ../setup/test_setup.yml
          vars:
            create_test_case_folder: true

        - name: "Skip test case"
          include_tasks: ../../common/skip_test_case.yml
          vars:
            skip_msg: >-
              WSL 2 test is not supported by {{ guest_os_ansible_distribution }}
              ({{ guest_os_ansible_architecture }}, build {{ guest_os_build_num }}).
              This test requires 64-bit Windows 10 build 19041 or later, Windows 11,
              or Windows Server 2022 or later.
            skip_reason: "Not Supported"
          when: >
            (guest_os_ansible_distribution_major_ver | int < 10) or
            (guest_os_ansible_architecture == '32-bit') or
            (guest_os_product_type == 'server' and guest_os_build_num | int < 20348) or
            (guest_os_product_type == 'client' and guest_os_build_num | int < 19041)

        - name: "Skip test case"
          include_tasks: ../../common/skip_test_case.yml
          vars:
            skip_msg: "There is known issue of WSL installation in Windows Server Core, please refer to this issue https://github.com/microsoft/WSL/issues/10008, will add Windows Server Core support after this issue is resolved."
            skip_reason: "Not Supported"
          when:
            - guest_os_installation_type == "Server Core"

        # Install the latest version of WSL downloaded from github by default.
        # Change 'wsl_install_source' to 'cmd' to install WSL by executing
        # 'wsl.exe' command in guest OS directly.
        - name: "Set fact of the WSL install source"
          ansible.builtin.set_fact:
            wsl_install_source: "github"

        - name: "Prepare WSL testing"
          include_tasks: wsl_test_prepare.yml

        - name: "Install WSL via 'wsl.exe' tool"
          include_tasks: install_wsl_via_cmd.yml
          when: wsl_install_source == "cmd"

        - name: "Install WSL via downloaded MSI from github"
          include_tasks: install_wsl_via_msi.yml
          when: wsl_install_source == "github"

        - name: "Check default WSL version 2"
          include_tasks: check_wsl_version.yml

        - name: "Install WSL distribution"
          include_tasks: install_wsl_distro.yml

        - name: "Check WSL distribution"
          include_tasks: check_wsl_distro.yml

        - name: "Uninstall WSL distribution"
          include_tasks: unregister_wsl_distro.yml
      rescue:
        - name: "Test case failure"
          include_tasks: ../../common/test_rescue.yml
